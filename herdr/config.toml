onboarding = false
[theme]
name = "catppuccin-macchiato"

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false

[experimental]
kitty_graphics = true

[keys]
# Keep tmux-era prefix; Ghostty forwards cmd+* as ctrl+a + action (\x01…).
prefix = "ctrl+a"
rename_tab = "prefix+,"

# Workspace jump / cycle (Ghostty: cmd+shift+1..9, cmd+shift+n/p).
# Takes shift+n/p from the stock new_workspace / rename_pane defaults.
switch_workspace = "prefix+shift+1..9"
next_workspace = "prefix+shift+n"
previous_workspace = "prefix+shift+p"
new_workspace = "prefix+shift+c"
rename_pane = "prefix+shift+e"

# Defaults Ghostty depends on (documented here so they stay stable):
# new_tab = prefix+c          → cmd+t
# next_tab / previous_tab     → cmd+n / cmd+p
# switch_tab = prefix+1..9    → cmd+1..9
# switch_workspace = prefix+shift+1..9 → cmd+shift+1..9
# next_workspace / previous_workspace → cmd+shift+n / cmd+shift+p
# close_pane = prefix+x       → cmd+w
# close_tab = prefix+shift+x  → cmd+shift+w
# workspace_picker = prefix+w → cmd+o
# goto = prefix+g             → cmd+g
# split_vertical = prefix+v   → cmd+d
# split_horizontal = prefix+minus → cmd+shift+d
# zoom = prefix+z             → cmd+f
# focus_pane_* = prefix+hjkl  → cmd+alt+hjkl
