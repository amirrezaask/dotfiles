font_family      MonoLisa

font_size 16

auto_reload_config -1

hide_window_decorations titlebar-only
draw_minimal_borders yes
inactive_text_alpha 0.75
window_padding_width 4

cursor_shape beam
cursor_blink_interval -1
cursor_shape_unfocused hollow

toggle_maximized
# Set to a non 0 integer to activate cursor trails
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 0

# shell
shell_integration enabled
allow_remote_control yes

# This will actually disable the tab bar
tab_bar_edge top
tab_bar_align center
tab_bar_style fade
tab_bar_min_tabs 2

repaint_delay 10
input_delay 3

enabled_layouts splits,stack

# Herdr-compatible shortcuts: send ctrl+a (Herdr's prefix) followed by the
# Herdr binding. These mirror ghostty/config and override Kitty's defaults.
# Kitty's send_text accepts C-style hex escapes, so \x01 is ctrl+a.
map cmd+t send_text all \x01c
map cmd+w send_text all \x01x
map cmd+shift+w send_text all \x01X
map cmd+n send_text all \x01n
map cmd+p send_text all \x01p

# Jump to tabs 1..9.
map cmd+1 send_text all \x011
map cmd+2 send_text all \x012
map cmd+3 send_text all \x013
map cmd+4 send_text all \x014
map cmd+5 send_text all \x015
map cmd+6 send_text all \x016
map cmd+7 send_text all \x017
map cmd+8 send_text all \x018
map cmd+9 send_text all \x019

# Jump to workspaces 1..9 (shifted US digit symbols).
map cmd+shift+1 send_text all \x01!
map cmd+shift+2 send_text all \x01@
map cmd+shift+3 send_text all \x01\x23
map cmd+shift+4 send_text all \x01$
map cmd+shift+5 send_text all \x01%
map cmd+shift+6 send_text all \x01^
map cmd+shift+7 send_text all \x01&
map cmd+shift+8 send_text all \x01*
map cmd+shift+9 send_text all \x01(

# Workspace cycle.
map cmd+shift+n send_text all \x01N
map cmd+shift+p send_text all \x01P

# Workspace picker, goto, and tab rename.
map cmd+o send_text all \x01w
map cmd+g send_text all \x01g
map cmd+r send_text all \x01,

# Splits and zoom.
map cmd+d send_text all \x01v
map cmd+shift+d send_text all \x01-
map cmd+f send_text all \x01z

# Pane focus.
map cmd+alt+h send_text all \x01h
map cmd+alt+j send_text all \x01j
map cmd+alt+k send_text all \x01k
map cmd+alt+l send_text all \x01l

# Kitty-specific layout and pane navigation shortcuts.
map cmd+enter next_layout
map cmd+x next_layout
map cmd+left neighboring_window left
map cmd+down neighboring_window down
map cmd+up neighboring_window up
map cmd+right neighboring_window right
map cmd+shift+comma load_config_file

# Theme
include themes/macchiato.conf
